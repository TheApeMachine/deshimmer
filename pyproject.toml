[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deshimmer"
version = "0.1.0"
description = "Audio artifact reconstruction, spectral repair, and parameter optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TheApeMachine" }
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "soundfile>=0.12.0",
    "matplotlib>=3.6.0",
    "gradio>=4.0.0",
    "pillow>=9.0.0",
    "optuna>=3.0.0",
    "numba>=0.57.0",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
deshimmer = "deshimmer.ui.app:main"
deshimmer-ui = "deshimmer.ui.app:main"
deshimmer-cli = "deshimmer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deshimmer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]


